[package]
name = "telinha"
version = "0.1.0"
description = "Transmita sua tela, áudio e câmera para os amigos, direto (P2P)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
# Ponte: servidor TURN embutido + abrir portas no roteador (UPnP)
turn = "0.17.3"
webrtc-util = { version = "0.17.1", default-features = false, features = ["conn", "vnet"] }
igd-next = "0.18"
tokio = { version = "1", features = ["net", "sync", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Registry",
] }

# Build de release pequeno e leve
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
