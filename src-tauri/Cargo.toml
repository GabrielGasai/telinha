[package]
name = "telinha"
version = "0.1.0"
description = "Transmita sua tela, áudio e câmera para os amigos, direto (P2P)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# Build de release pequeno e leve
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
